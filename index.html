<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chizuru World Tour — Visual Novel</title>
<link rel="icon" type="image/png" href="promo/logo.png">
<style>
:root{--bg:#160f22;--card:#251a3a;--accent:#ff5c8a;--gold:#ffc857;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.screen{display:none;flex-direction:column;gap:12px}
.screen.on{display:flex}
h1{font-size:1.3rem;color:var(--accent);text-align:center}
.sub{font-size:.8rem;opacity:.7;text-align:center}
.title-img{width:100%;max-height:52vh;object-fit:contain;object-position:bottom;background:radial-gradient(circle at 50% 30%,#3a2a55,#160f22 75%);border-radius:16px}
.btn{padding:14px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.btn.alt{background:var(--card);border:2px solid var(--accent)}
.map{display:grid;gap:8px}
.dest{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--card);border:2px solid #3a2f52;cursor:pointer;text-align:left;color:var(--text)}
.dest img{width:52px;height:70px;object-fit:cover;object-position:top;border-radius:8px}
.dest .t{flex:1}.dest .t b{display:block;font-size:.9rem}.dest .t span{font-size:.72rem;opacity:.7}
.dest.done{border-color:#4ade80}
.dest.locked{opacity:.45;cursor:default}
.dest .st{font-size:1.1rem}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.hearts{color:var(--accent);font-weight:800}
.cg{border-radius:16px;overflow:hidden;aspect-ratio:2/3;max-height:46vh;background:#000}
.cg img{width:100%;height:100%;object-fit:cover;object-position:top}
.dlg{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:14px;min-height:110px;cursor:pointer}
.dlg .who{color:var(--gold);font-weight:800;font-size:.85rem;margin-bottom:6px}
.dlg .txt{font-size:.95rem;line-height:1.45}
.dlg .hint{font-size:.68rem;opacity:.5;text-align:right;margin-top:8px}
.choices{display:grid;gap:8px}
.choices button{padding:12px;border-radius:12px;border:2px solid #4a3f66;background:var(--card);color:var(--text);font-size:.88rem;text-align:left;cursor:pointer}
.choices button:active{transform:scale(.98);border-color:var(--accent)}
.endbox{text-align:center;padding:20px 6px}
.endbox h2{color:var(--gold);font-size:1.4rem;margin-bottom:10px}
.endbox p{opacity:.9;line-height:1.5;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<div class="screen on" id="scr-title">
<img src="promo/logo.png" alt="Logo World Tour" style="width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 8px">
<h1>Chizuru World Tour</h1>
<div class="sub">Visual novel · pacar sewaan keliling dunia · 8 destinasi</div>
<img class="title-img" style="object-fit:cover" src="promo/hero.jpg" alt="Chizuru World Tour">
<button class="btn" onclick="toMap()">Mulai / Lanjutkan Tur</button>
<button class="btn alt" onclick="reset()">Reset Progres</button>
</div>

<div class="screen" id="scr-map">
<h1>Peta Destinasi</h1>
<div class="hud"><span>Selesaikan tur berurutan</span><span class="hearts" id="map-aff"></span></div>
<div class="map" id="map"></div>
</div>

<div class="screen" id="scr-scene">
<div class="hud"><span id="sc-place"></span><span class="hearts" id="sc-aff"></span></div>
<div class="cg"><img id="sc-img" alt="scene"></div>
<div class="dlg" id="dlg" onclick="advance()"><div class="who" id="who"></div><div class="txt" id="txt"></div><div class="hint">tap untuk lanjut ▸</div></div>
<div class="choices" id="choices"></div>
</div>

<div class="screen" id="scr-end">
<div class="endbox"><h2 id="end-t"></h2><p id="end-p"></p><p class="hearts" id="end-aff"></p></div>
<img class="title-img" id="end-img" src="assets/100-ao-dai-vietnam.jpg" alt="ending">
<button class="btn" onclick="toMap()">Kembali ke Peta</button>
</div>
</div>
<script>
const D=[
{id:1,place:"Yogyakarta, Jawa",img:"001-kebaya-jawa.jpg",steps:[
 ["c","Selamat datang di Yogyakarta! Aku pakai kebaya Jawa hari ini... gimana, cocok?"],
 ["y","Kamu terlihat anggun banget."],
 ["c","Hehe, terima kasih. Ayo, ke pendopo itu — ada upacara sunset."],
 ["choice","Mau jalan bareng ke mana dulu?",[
   ["Ke pendopo, sambil pegangan tangan.",2,"E-eh... boleh. Tapi jangan lepas ya."],
   ["Foto dulu di depan joglo.",1,"Boleh! Aku pose wink dulu~"],
   ["Cari makan dulu, aku lapar.",0,"Yah, padahal aku sudah dandan... ya sudah, gudeg dulu!"]]],
 ["c","Malam ini hangat ya... terima kasih sudah menemaniku."]]},
{id:4,place:"Bali",img:"004-kebaya-bali.jpg",steps:[
 ["c","Candi bentar di belakangku ini gerbang pura. Aku pakai kebaya Bali putih-emas."],
 ["y","Kamu seperti bidadari Bali."],
 ["c","Bisa aja kamu. Ada sesajen bunga di sana — jangan diinjak ya."],
 ["choice","Ajak Chizuru:",[
   ["Menaruh bunga canang sari bersama.",2,"Kamu manis... ayo, kita berdoa bersama."],
   ["Menari kecil meniru penari Bali.",1,"Haha, ayo! Tapi jangan tertawakan aku."],
   ["Langsung ke pantai.",0,"Eh? Tunggu, aku belum selesai cerita!"]]],
 ["c","Golden hour di Bali... dan kamu di sini. Sempurna."]]},
{id:15,place:"Longhouse Dayak Kenyah, Kalimantan",img:"015-dayak-kenyah.jpg",steps:[
 ["c","Ini longhouse Kenyah. Manik-manik di bajuku ini dibuat tangan, lho."],
 ["y","Detailnya indah banget."],
 ["c","Ayo duduk di beranda. Aku ceritakan arti motifnya."],
 ["choice","Kamu:",[
   ["Dengarkan sambil memegang tangannya.",2,"...Kamu bikin aku susah konsentrasi."],
   ["Tanya soal burung enggang.",1,"Rangkong! Itu simbol kesetiaan, tahu?"],
   ["Selfie dulu.",0,"Kamu ini... ya sudah, satu foto ya."]]],
 ["c","Sungai, hutan, dan kamu. Aku suka hari ini."]]},
{id:16,place:"Pantai Papua",img:"016-papua-rumbai.jpg",steps:[
 ["c","Pantai Papua! Aku pakai rumbai dan mahkota bulu bird-of-paradise."],
 ["y","Kamu keren banget, seperti putri pantai."],
 ["c","Ayo naik perahu itu! Airnya jernih sekali."],
 ["choice","Saat naik perahu:",[
   ["Pegang tangannya supaya tidak goyang.",2,"P-perahu goyang! ...Tapi tanganmu hangat."],
   ["Ajak main air.",1,"Awas, aku cipratin kamu!"],
   ["Duduk diam menikmati sunset.",0,"Kok diam? ...Ya sudah, aku temani duduk."]]],
 ["c","Kalau waktu berhenti di sini, aku tidak keberatan."]]},
{id:79,place:"Hawaii",img:"079-hawaii-hula.jpg",steps:[
 ["c","Aloha! Aku pakai pa'u skirt dan lei bunga. Ayo menari hula!"],
 ["y","Ajari aku gerakannya."],
 ["c","Tangan seperti ombak... hati seperti bunga. Gitu!"],
 ["choice","Kamu:",[
   ["Menari berhadapan dengannya.",2,"Kamu... jangan tatap aku terus, aku malu."],
   ["Rekam video dia menari.",1,"Boleh, tapi nanti kita edit bareng ya."],
   ["Makan poke bowl dulu.",0,"Makan terus kamu! ...Tapi enak sih."]]],
 ["c","Mahalo sudah menari denganku. Ini lei untukmu."]]},
{id:92,place:"Sevilla, Spanyol",img:"092-spain-flamenco.jpg",steps:[
 ["c","Sevilla! Gaun flamenco merah polkadot... aku berlatih floreo seharian."],
 ["y","Gerakan tanganmu indah."],
 ["c","Ayo, coba ikuti ritmenya. Palmeras — tepuk tangan!"],
 ["choice","Kamu:",[
   ["Menari flamenco bersamanya.",2,"Olé! ...Kamu membuatku salah langkah."],
   ["Tepuk tangan mengikuti ritme.",1,"Ya! Bagus! Terus!"],
   ["Duduk menonton saja.",0,"Penonton setia ya... aku tampil untukmu saja."]]],
 ["c","Malam Andalusia, bunga geranium, dan kamu. Olé!"]]},
{id:97,place:"Gyeongbokgung, Korea",img:"097-hanbok-korea.jpg",steps:[
 ["c","Gyeongbokgung! Hanbok merah-emas ini... aku pakai binyeo di rambutku."],
 ["y","Seperti putri Joseon."],
 ["c","Ayo foto di halaman istana. Aku finger heart dulu~"],
 ["choice","Kamu:",[
   ["Balas finger heart dan pegang tangannya.",2,"...Kamu belajar dari mana? Jantungku kaget."],
   ["Foto bersebelahan.",1,"Dekat sedikit... oke, cheese!"],
   ["Jajan tteokbokki dulu.",0,"Hanbok dulu, jajan nanti! ...Ya sudah, beli satu."]]],
 ["c","Saranghae... e-eh, itu dialog drama! Lupakan!"]]},
{id:98,place:"Hoi An, Vietnam",img:"100-ao-dai-vietnam.jpg",steps:[
 ["c","Hoi An malam hari! Lampion di mana-mana. Ao dai merahku cocok dengan lampion, kan?"],
 ["y","Kamu yang paling bersinar di sini."],
 ["c","Ayo naik perahu lampion. Katanya, permohonan di sini terkabul."],
 ["choice","Permohonanmu:",[
   ["Berbisik: 'Semoga kita selalu bersama.'",2,"...Permohonanku juga sama."],
   ["Melepas lampion air bersama.",1,"Ayo... semoga perjalanan kita panjang."],
   ["Foto lampion saja.",0,"Kamera terus... aku cemburu pada kameramu."]]],
 ["c","Terima kasih untuk tur dunia ini. Kamu... lebih dari sekadar klien."]]}
];
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem('vn_save')||'null')||{aff:0,done:[]};
let cur=null,step=0;
function save(){localStorage.setItem('vn_save',JSON.stringify(S))}
function show(s){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(s).classList.add('on')}
function reset(){if(confirm('Reset semua progres?')){S={aff:0,done:[]};save();toMap()}}
function toMap(){
 show('scr-map');$('map-aff').textContent='♥ '+S.aff;
 const m=$('map');m.innerHTML='';
 D.forEach((d,i)=>{
  const unlocked=i===0||S.done.includes(D[i-1].id);
  const done=S.done.includes(d.id);
  const b=document.createElement('button');
  b.className='dest'+(done?' done':'')+(!unlocked?' locked':'');
  b.innerHTML='<img src="assets/'+d.img+'"><div class="t"><b>'+(i+1)+'. '+d.place+'</b><span>'+(done?'Selesai ✓':unlocked?'Siap dikunjungi':'Terkunci')+'</span></div><div class="st">'+(done?'💚':unlocked?'➜':'🔒')+'</div>';
  if(unlocked)b.onclick=()=>startScene(i);
  m.appendChild(b);
 });
 if(S.done.length===D.length)setTimeout(()=>ending(),300);
}
function startScene(i){cur=D[i];step=0;show('scr-scene');$('sc-place').textContent=cur.place;$('sc-img').src='assets/'+cur.img;renderStep()}
function aff(){$('sc-aff').textContent='♥ '+S.aff}
function renderStep(){
 aff();$('choices').innerHTML='';
 const s=cur.steps[step];
 if(!s){finishScene();return}
 if(s[0]==='choice'){
  $('who').textContent='Pilihanmu';$('txt').textContent=s[1];
  s[2].forEach(o=>{
   const b=document.createElement('button');b.textContent=o[0];
   b.onclick=()=>{S.aff+=o[1];save();$('who').textContent='Chizuru';$('txt').textContent=o[2];$('choices').innerHTML='';step++;
    const nxt=document.createElement('button');nxt.textContent='Lanjut ▸';nxt.onclick=()=>renderStep();$('choices').appendChild(nxt);aff();};
   $('choices').appendChild(b);
  });
 }else{
  $('who').textContent=s[0]==='c'?'Chizuru':'Kamu';$('txt').textContent=s[1];
 }
}
function advance(){const s=cur.steps[step];if(s&&s[0]!=='choice'){step++;renderStep()}}
function finishScene(){if(!S.done.includes(cur.id))S.done.push(cur.id);save();toMap()}
function ending(){
 show('scr-end');
 const a=S.aff;
 $('end-aff').textContent='Total affection: ♥ '+a+' / 16';
 if(a>=13){$('end-t').textContent='TRUE ENDING';$('end-p').textContent='Chizuru melepas status "pacar sewaan". "Perpanjangan kontraknya... seumur hidup, mau?"';}
 else if(a>=8){$('end-t').textContent='GOOD ENDING';$('end-p').textContent='"Tur berikutnya... aku yang traktir. Janji ya?" Chizuru menyelipkan foto polaroid kalian ke sakumu.';}
 else{$('end-t').textContent='NORMAL ENDING';$('end-p').textContent='"Klien yang menyenangkan. Sampai jumpa di penyewaan berikutnya!" ...tapi matanya berkata lain.';}
}
</script>
</body>
</html>
